name: Bug Report
description: Report a bug in @psenger/multivalue-map
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill in as much detail as possible.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of what the bug is.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Minimal code or steps that reproduce the issue.
      placeholder: |
        const mvm = new MultiValueMap();
        mvm.set('key', 'value');
        // ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behaviour
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behaviour
      description: What actually happened? Include error messages or stack traces if available.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Package Version
      description: Output of `npm list @psenger/multivalue-map`
    validations:
      required: true

  - type: input
    id: node
    attributes:
      label: Node.js Version
      description: Output of `node --version`
    validations:
      required: true
